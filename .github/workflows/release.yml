name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (musl x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build server and cli (musl)
        run: cargo build --release --target x86_64-unknown-linux-musl -p server -p cli

      - name: Stage artifacts and checksums
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/neteval-server dist/neteval-server-linux-x86_64
          cp target/x86_64-unknown-linux-musl/release/neteval-cli dist/neteval-cli-linux-x86_64
          chmod +x dist/neteval-server-linux-x86_64 dist/neteval-cli-linux-x86_64
          (cd dist && sha256sum neteval-server-linux-x86_64 neteval-cli-linux-x86_64 > SHA256SUMS-linux.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x86_64
          path: dist/

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build server and cli
        run: cargo build --release -p server -p cli

      - name: Stage artifacts and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/neteval-server.exe dist/neteval-server-windows-x86_64.exe
          Copy-Item target/release/neteval-cli.exe dist/neteval-cli-windows-x86_64.exe
          $lines = @(
            (Get-FileHash dist/neteval-server-windows-x86_64.exe -Algorithm SHA256),
            (Get-FileHash dist/neteval-cli-windows-x86_64.exe -Algorithm SHA256)
          ) | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($_.Path))"
          }
          Set-Content -Path dist/SHA256SUMS-windows.txt -Value $lines -Encoding ASCII

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-x86_64
          path: dist/

  build-windows-gui:
    name: Build Windows GUI (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: apps/gui
        run: npm ci

      - name: Build Windows NSIS installer
        working-directory: apps/gui
        run: npx tauri build --bundles nsis --ci

      - name: Stage artifacts and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $setup = Get-ChildItem -Path target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setup) {
            throw "Expected NSIS setup installer under target/release/bundle/nsis"
          }
          Copy-Item $setup.FullName dist/neteval-gui-windows-x86_64-setup.exe
          $h = Get-FileHash dist/neteval-gui-windows-x86_64-setup.exe -Algorithm SHA256
          $line = "$($h.Hash.ToLowerInvariant())  neteval-gui-windows-x86_64-setup.exe"
          Set-Content -Path dist/SHA256SUMS-windows-gui.txt -Value $line -Encoding ASCII

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-gui
          path: dist/

  build-android-apk:
    name: Build Android APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and build-tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configure NDK environment
        shell: bash
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/26.3.11579264"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Install frontend dependencies & init Android project
        working-directory: apps/gui
        run: |
          npm ci
          npm run build
          npx tauri android init --ci --skip-targets-install
          npx tauri icon src-tauri/icons/app-icon.svg

      - name: Build arm64 APK
        working-directory: apps/gui
        run: npx tauri android build --apk --target aarch64 --ci

      - name: Sign, verify, and stage artifacts and checksums
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_ALIAS secrets must all be set before releasing Android APK." >&2
            exit 1
          fi
          mkdir -p dist
          trap 'rm -f /tmp/neteval-release.p12 dist/neteval-gui-android-arm64-aligned.apk' EXIT
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > /tmp/neteval-release.p12
          APK_PATH=$(find apps/gui/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n1)
          test -n "$APK_PATH"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK_PATH" dist/neteval-gui-android-arm64-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/neteval-release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out dist/neteval-gui-android-arm64.apk \
            dist/neteval-gui-android-arm64-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/neteval-gui-android-arm64.apk
          (cd dist && sha256sum neteval-gui-android-arm64.apk > SHA256SUMS-android.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android-arm64
          path: dist/

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-windows-gui, build-android-apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Combine checksums
        shell: bash
        run: |
          cat release-assets/SHA256SUMS-*.txt > release-assets/SHA256SUMS.txt
          rm -f release-assets/SHA256SUMS-*.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: NetEval ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
