name: GUI CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
  workflow_dispatch:

jobs:
  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  workspace-test:
    name: Workspace Clippy & Tests
    needs: frontend-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json

      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build GUI dist
        working-directory: apps/gui
        run: |
          npm ci
          npm run build

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace

  build-windows-gui:
    name: Build Windows GUI
    needs: frontend-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Build GUI dist
        working-directory: apps/gui
        run: |
          npm ci
          npm run build

      - name: Build Windows GUI binary
        run: cargo build --release -p neteval-gui --features custom-protocol

      - name: Stage Windows GUI binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/neteval-gui.exe dist/neteval-gui-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: neteval-gui-windows-x86_64
          path: dist/neteval-gui-windows-x86_64.exe

  build-android-apk:
    name: Build Android APK
    needs: frontend-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and build-tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configure NDK environment
        shell: bash
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/26.3.11579264"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Install frontend dependencies & init Android project
        working-directory: apps/gui
        run: |
          npm ci
          npm run build
          npx tauri android init --ci --skip-targets-install
          npx tauri icon src-tauri/icons/app-icon.svg

      - name: Build arm64 APK
        working-directory: apps/gui
        run: npx tauri android build --apk --target aarch64 --ci

      - name: Sign, verify, and stage APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p dist
          trap 'rm -f /tmp/neteval-release.p12 /tmp/ci-ephemeral.p12 dist/neteval-gui-android-arm64-aligned.apk' EXIT
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
              echo "ERROR: ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS must be set when ANDROID_KEYSTORE_BASE64 is configured." >&2
              exit 1
            fi
            KS_PATH="/tmp/neteval-release.p12"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KS_PATH"
          else
            echo "Notice: ANDROID_KEYSTORE_BASE64 not set; generating ephemeral CI keystore for verification."
            KS_PATH="/tmp/ci-ephemeral.p12"
            rm -f "$KS_PATH"
            export ANDROID_KEYSTORE_PASSWORD="ci-ephemeral-password"
            ANDROID_KEY_ALIAS="ci-ephemeral"
            keytool -genkeypair \
              -keystore "$KS_PATH" \
              -storetype PKCS12 \
              -alias "$ANDROID_KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 1 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -dname "CN=NetEval CI"
          fi
          APK_PATH=$(find apps/gui/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n1)
          test -n "$APK_PATH"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK_PATH" dist/neteval-gui-android-arm64-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KS_PATH" \
            --ks-type PKCS12 \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out dist/neteval-gui-android-arm64.apk \
            dist/neteval-gui-android-arm64-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/neteval-gui-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: neteval-gui-android-arm64
          path: dist/neteval-gui-android-arm64.apk
