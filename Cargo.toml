[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/server",
    "crates/client-core",
    "crates/cli",
    "apps/gui/src-tauri",
]

[workspace.package]
version = "1.3.5"
edition = "2021"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
client-core = { path = "crates/client-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "signal"] }
tokio-util = "0.7"
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
clap = { version = "4", features = ["derive"] }
socket2 = "0.5"
